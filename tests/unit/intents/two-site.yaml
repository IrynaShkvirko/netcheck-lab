# A second intent for unit tests only (never deployed by CI): a different shape from
# intent/lab.yaml, so code that quietly assumes campus-mini shows up in the unit run.
#
#   h1 --p1\                              /p1-- h3 (VLAN 10)
#   h2 --p2- sw1 -p3 == trunk 10,20 == p3- sw2
#             |p4                         |p4 \p2-- h4 (VLAN 30)
#        trunk 10,20                  trunk 30
#             |                           |
#            r1 ==primary (cost 10)== r2 == (cost 10) == r3
#             \\================backup (cost 50)=========//
#                                     |p3
#                                    h5 (10.0.50.0/24, passive)
#
# What differs from campus-mini: three routers, so routers learn transit /31s; two
# switches with VLAN 10 spanning both; a VLAN gateway on a second router (r3, VLAN 30);
# the backup path goes through a third router; timers are 2 s / 8 s, not 1 s / 4 s.

name: two-site

ospf:
  area: 0
  network: point-to-point
  hello_interval: 2
  dead_interval: 8

nodes:
  r1: {role: router, router_id: 1.1.1.1}
  r2: {role: router, router_id: 2.2.2.2}
  r3: {role: router, router_id: 3.3.3.3}
  sw1: {role: switch}
  sw2: {role: switch}
  h1: {role: host, ip: 10.0.10.11/24, gateway: 10.0.10.1}
  h2: {role: host, ip: 10.0.20.12/24}
  h3: {role: host, ip: 10.0.10.13/24, gateway: 10.0.10.1}
  h4: {role: host, ip: 10.0.30.14/24, gateway: 10.0.30.1}
  h5: {role: host, ip: 10.0.50.15/24, gateway: 10.0.50.1}

vlans:
  10: {name: users, gateway: {node: r1, ip: 10.0.10.1/24}}
  20: {name: isolated}
  30: {name: lab, gateway: {node: r3, ip: 10.0.30.1/24}}

links:
  # site A access ports
  - {a: {node: h1, port: p1}, b: {node: sw1, port: p1}, mode: access, vlan: 10}
  - {a: {node: h2, port: p1}, b: {node: sw1, port: p2}, mode: access, vlan: 20}
  # inter-switch trunk: VLAN 10 spans both sites
  - {a: {node: sw1, port: p3}, b: {node: sw2, port: p3}, mode: trunk, vlans: [10, 20]}
  # site B access ports
  - {a: {node: h3, port: p1}, b: {node: sw2, port: p1}, mode: access, vlan: 10}
  - {a: {node: h4, port: p1}, b: {node: sw2, port: p2}, mode: access, vlan: 30}
  # router-on-a-stick at each site
  - {a: {node: sw1, port: p4}, b: {node: r1, port: p1}, mode: trunk, vlans: [10, 20]}
  - {a: {node: sw2, port: p4}, b: {node: r3, port: p1}, mode: trunk, vlans: [30]}
  # routed core: a triangle
  - a: {node: r1, port: p2, ip: 10.0.12.0/31}
    b: {node: r2, port: p1, ip: 10.0.12.1/31}
    ospf_cost: 10
    label: primary
  - a: {node: r2, port: p2, ip: 10.0.23.0/31}
    b: {node: r3, port: p2, ip: 10.0.23.1/31}
    ospf_cost: 10
  - a: {node: r1, port: p3, ip: 10.0.13.0/31}
    b: {node: r3, port: p3, ip: 10.0.13.1/31}
    ospf_cost: 50
    label: backup
  # server LAN behind r2 (passive OSPF)
  - a: {node: r2, port: p3, ip: 10.0.50.1/24}
    b: {node: h5, port: p1}
    ospf_passive: true

expect:
  reachable:
    - [h1, h3]
    - [h1, h4]
    - [h3, h5]
    - [h4, h5]
  isolated:
    - [h1, h2]
    - [h3, h2]
