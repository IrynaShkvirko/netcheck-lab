frr defaults traditional
hostname r2
!
interface eth1
 description to-r1-p2
 ip address 10.0.12.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 10
!
interface eth2
 description to-r3-p2
 ip address 10.0.23.0/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 10
!
interface eth3
 description to-h5-p1
 ip address 10.0.50.1/24
 ip ospf area 0
 ip ospf passive
!
router ospf
 ospf router-id 2.2.2.2
!
line vty
!
