frr defaults traditional
hostname r3
!
interface eth1.30
 description vlan30-lab-gateway
 ip address 10.0.30.1/24
 ip ospf area 0
 ip ospf passive
!
interface eth2
 description to-r2-p2
 ip address 10.0.23.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 10
!
interface eth3
 description to-r1-p3
 ip address 10.0.13.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 50
!
router ospf
 ospf router-id 3.3.3.3
!
line vty
!
