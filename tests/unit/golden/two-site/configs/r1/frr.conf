frr defaults traditional
hostname r1
!
interface eth1.10
 description vlan10-users-gateway
 ip address 10.0.10.1/24
 ip ospf area 0
 ip ospf passive
!
interface eth2
 description to-r2-p1
 ip address 10.0.12.0/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 10
!
interface eth3
 description to-r3-p3
 ip address 10.0.13.0/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 50
!
router ospf
 ospf router-id 1.1.1.1
!
line vty
!
