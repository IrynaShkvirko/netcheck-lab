name: nightly

# The resilience SLAs as a gate (ADR-0004): the lab suite in strict SLA mode, the failover
# repeated 5 times and its median held to the SLA. PR runs keep recording SLAs only
# (NETCHECK_SLA_MODE=record); this job is where a slow regression fails. The measurement
# history lives in the Actions cache, and the job summary compares tonight with earlier runs.
# The mutation job runs every mutant and holds every guarded module to its floor
# ([tool.mutation-floor] in pyproject.toml). Pull requests don't run it: it takes too long.
# Scheduled runs use the default branch.

on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC every day
  workflow_dispatch:

jobs:
  sla:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NETCHECK_SLA_MODE: strict
      NETCHECK_REPEATS: "5"
      NETCHECK_TIME_FACTOR: "2"            # timeouts only; SLAs are not scaled
      NETCHECK_HISTORY: history/measurements.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's downloads sometimes answer 504 for a few minutes: try uv twice
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: uv
        continue-on-error: true
      - if: steps.uv.outcome == 'failure'
        run: sleep 60
      - if: steps.uv.outcome == 'failure'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make install-clab
      - name: Restore the measurement history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          key: measurements-${{ github.run_id }}
          restore-keys: measurements-
      - id: up
        run: make lab-up
      - run: make test-lab
      - name: Measurements in the job summary
        if: always() && steps.up.outcome == 'success'
        run: uv run python -m netcheck summary >> "$GITHUB_STEP_SUMMARY"
      - name: Save the measurement history
        if: always() && steps.up.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          key: measurements-${{ github.run_id }}
      - name: Upload reports, measurements and history
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netcheck-nightly
          path: |
            artifacts/
            history/
      - if: always() && steps.up.outcome != 'skipped'
        run: make lab-down

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's downloads sometimes answer 504 for a few minutes: try uv twice
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: uv
        continue-on-error: true
      - if: steps.uv.outcome == 'failure'
        run: sleep 60
      - if: steps.uv.outcome == 'failure'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run mutmut run
      - name: Floor and survivors in the job summary
        run: |
          set -o pipefail
          uv run python scripts/mutation-floor.py check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Survivors of every module
        if: always()
        run: uv run mutmut results > mutmut-results.txt || true
      - name: Upload the survivors
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-results
          path: mutmut-results.txt
