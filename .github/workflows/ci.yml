name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # GitHub's downloads sometimes answer 504 for a few minutes: try uv twice
      - uses: astral-sh/setup-uv@v5
        id: uv
        continue-on-error: true
      - if: steps.uv.outcome == 'failure'
        run: sleep 60
      - if: steps.uv.outcome == 'failure'
        uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit

  lab:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write                  # the JUnit report publishes a check run
    env:
      NETCHECK_SLA_MODE: record      # SLAs recorded, not enforced, on shared runners (ADR-0004)
      NETCHECK_TIME_FACTOR: "2"
    steps:
      - uses: actions/checkout@v4
      # GitHub's downloads sometimes answer 504 for a few minutes: try uv twice
      - uses: astral-sh/setup-uv@v5
        id: uv
        continue-on-error: true
      - if: steps.uv.outcome == 'failure'
        run: sleep 60
      - if: steps.uv.outcome == 'failure'
        uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make install-clab   # retries and checks each download (scripts/install-clab.sh)
      - id: up
        run: make lab-up
      - run: make test-lab
      - name: Upload reports, device logs and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netcheck-artifacts
          path: artifacts/
      - name: Publish JUnit summary
        if: always() && hashFiles('artifacts/junit.xml') != ''   # no tests ran, nothing to report
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: artifacts/junit.xml
      - if: always() && steps.up.outcome != 'skipped'   # nothing to tear down otherwise
        run: make lab-down
