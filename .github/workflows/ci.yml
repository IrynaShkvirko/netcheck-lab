name: ci

# Pull requests, and master after each merge (the commit that lands on master is tested even
# when another PR merged in between). A push to a branch without a PR runs nothing: open the
# PR or use "Run workflow". Changes only to docs and agent files skip CI entirely; changes
# only to unit tests and Markdown skip the lab job (scripts/lab-affected.py).
on:
  pull_request:
    paths-ignore: ["docs/**", ".claude/**", "GLOSSARY.md", "CLAUDE.md"]
  push:
    branches: [master]
    paths-ignore: ["docs/**", ".claude/**", "GLOSSARY.md", "CLAUDE.md"]
  workflow_dispatch:

# a new push to a PR cancels the run for the commit before it; master runs always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned by commit SHA (a tag can be moved), with the version in a comment;
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]   # requires-python >=3.11, up to the newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's downloads sometimes answer 504 for a few minutes: try uv twice
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: uv
        continue-on-error: true
        with:
          python-version: ${{ matrix.python }}
      - if: steps.uv.outcome == 'failure'
        run: sleep 60
      - if: steps.uv.outcome == 'failure'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked   # uv.lock as committed; a stale lock fails here
      - if: matrix.python == '3.11'   # lint and types once, on the oldest supported version
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest tests/unit

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lab: ${{ steps.diff.outputs.lab }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # no base (manual run, first push): no list, so the lab runs
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD
          fi | python3 scripts/lab-affected.py | tee -a "$GITHUB_OUTPUT"

  lab:
    needs: [checks, changes]
    if: needs.changes.outputs.lab == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write                  # the JUnit report publishes a check run
    env:
      NETCHECK_SLA_MODE: record      # SLAs recorded, not enforced, on shared runners (ADR-0004)
      NETCHECK_TIME_FACTOR: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's downloads sometimes answer 504 for a few minutes: try uv twice
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: uv
        continue-on-error: true
      - if: steps.uv.outcome == 'failure'
        run: sleep 60
      - if: steps.uv.outcome == 'failure'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make install-clab   # retries and checks each download (scripts/install-clab.sh)
      - id: up
        run: make lab-up
      - run: make test-lab
      # every demo fault must turn the tests it declares red, and the reset must turn them
      # green again (netcheck/faults/catalog.py, netcheck/faults/check.py); reports in artifacts/fault-check
      - run: make fault-check
      - name: Measurements in the job summary
        if: always() && steps.up.outcome == 'success'
        run: uv run python -m netcheck summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports, device logs and captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netcheck-artifacts
          path: artifacts/
      - name: Publish JUnit summary
        if: always() && hashFiles('artifacts/junit.xml') != ''   # no tests ran, nothing to report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: artifacts/junit.xml
      - if: always() && steps.up.outcome != 'skipped'   # nothing to tear down otherwise
        run: make lab-down
